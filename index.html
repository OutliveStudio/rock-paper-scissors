<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
        <title>Rock Paper Scissors</title>
    </head>

    <body>
        <p id="game-message">Result messages go here.</p>
        <div id="scores">
            <p id="player-score">Your Score <br>0</p>
            <p id="computer-score">Computer Score <br>0</p>
        </div>

        <div id="buttons">
            <button id="rock-button" class="button">🪨 Rock</button>
            <button id="paper-button" class="button">📄 Paper</button>
            <button id="scissors-button" class="button">✂️ Scissors</button>
        </div>
    </body>
</html>
